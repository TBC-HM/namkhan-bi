# Disaster Recovery - nightly off-site backup + proven-restore drill
#
# Runs on GitHub Actions deliberately: an independent failure domain from both
# Supabase and Vercel. A backup job hosted inside the system it protects dies with it.
#
# Writes results to governance.dr_runs / dr_artifacts / dr_drills via psql.
# Every data class is independent - one failing class marks itself failed and the
# run reports partial. It never aborts the others.

name: dr-nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [build/dr-pipeline-v1]

permissions:
  contents: read

concurrency:
  group: dr-nightly
  cancel-in-progress: false

env:
  R2_BUCKET: tbc-dr-prod
  R2_ENDPOINT: https://c83585fd55ad5b7cd6438054734f3568.r2.cloudflarestorage.com
  PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
  PGUSER: ${{ secrets.SUPABASE_DB_USER }}
  PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PGDATABASE: postgres
  PGPORT: '5432'

jobs:
  backup:
    name: Off-site backup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      run_id: ${{ steps.start.outputs.run_id }}
      db_key: ${{ steps.db.outputs.key }}
    steps:
      - name: Checkout (full history for the code bundle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client-17 and rclone
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone jq
          pg_dump --version

      - name: Configure rclone remotes
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          {
            echo "[r2]"
            echo "type = s3"
            echo "provider = Cloudflare"
            echo "endpoint = ${R2_ENDPOINT}"
            echo "access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}"
            echo "secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}"
            echo "acl = private"
            echo "no_check_bucket = true"
          } > ~/.config/rclone/rclone.conf
          if [ -n "${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" ]; then
            {
              echo ""
              echo "[sb]"
              echo "type = s3"
              echo "provider = Other"
              echo "endpoint = https://kpenyneooigsyuuomgct.storage.supabase.co/storage/v1/s3"
              echo "region = eu-central-1"
              echo "access_key_id = ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}"
              echo "secret_access_key = ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"
              echo "force_path_style = true"
            } >> ~/.config/rclone/rclone.conf
          fi
          rclone lsd r2:${R2_BUCKET} >/dev/null && echo "R2 reachable"

      - name: Open DR run
        id: start
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ "$(date -u +%d)" = "01" ]; then
            echo "tier=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "tier=daily" >> "$GITHUB_OUTPUT"
          fi
          RID=$(psql -qtAX -c "INSERT INTO governance.dr_runs (run_uid, trigger, actor) VALUES ('gh-${{ github.run_id }}', '${{ github.event_name }}', '${{ github.actor }}') RETURNING id;")
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "DR run $RID opened for $DAY"

      - name: Database dump
        id: db
        continue-on-error: true
        run: |
          set +e  # Don't exit on error - we need to record failures
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=db-$(date -u +%Y-%m-%dT%H%M).sql.gz

          # backup_log excluded by data: 5 GB of superseded inline payload.
          # documents_history already carries the same content.
          # idle_in_transaction_session_timeout prevents the open transaction
          # from blocking DDL + autovacuum for 40-70 min (fix for 2026-08-09 incident).
          PGOPTIONS='-c idle_in_transaction_session_timeout=5min' \
          pg_dump --format=plain --no-owner --no-privileges --quote-all-identifiers \
                  --exclude-table-data=documentation.backup_log 2>db.err | gzip -9 > "$OUT"
          DUMP_EXIT=$?

          if [ $DUMP_EXIT -ne 0 ]; then
            ERR=$(head -5 db.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'pg_dump exit $DUMP_EXIT: $ERR');"
            echo "::error::Database dump failed (exit $DUMP_EXIT): $ERR"
            exit 0  # continue-on-error handles this
          fi

          BYTES=$(stat -c%s "$OUT")
          if [ "$BYTES" -lt 100000 ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'dump too small: $BYTES bytes');"
            echo "::error::Database dump suspiciously small: $BYTES bytes"
            exit 0
          fi

          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="db/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'database', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Database dump: $BYTES bytes -> $KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: DDL bundle
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=ddl-${DAY}.sql.gz

          psql -qtAX -c "SELECT documentation.fn_ddl_bundle();" | gzip -9 > "$OUT"
          if [ $? -ne 0 ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'ddl', 'failed', 'fn_ddl_bundle failed');"
            echo "::error::DDL bundle failed"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="ddl/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'ddl', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'ddl', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "DDL bundle: $BYTES bytes -> $KEY"

      - name: Config bundle
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=config-${DAY}.tar.gz

          tar czf "$OUT" .github/workflows .vercel/project.json 2>tar.err
          if [ $? -ne 0 ]; then
            ERR=$(head -3 tar.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'config', 'failed', 'tar failed: $ERR');"
            echo "::error::Config bundle failed: $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="config/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'config', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'config', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Config bundle: $BYTES bytes -> $KEY"

      - name: Credential inventory
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=creds-${DAY}.sql.gz

          psql -qtAX -c "COPY (SELECT credential_name, system, reissue_at FROM governance.credentials ORDER BY credential_name) TO STDOUT WITH CSV HEADER;" | gzip -9 > "$OUT"
          if [ $? -ne 0 ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'credentials', 'failed', 'COPY failed');"
            echo "::error::Credential inventory failed"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="creds/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'credentials', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'credentials', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Credential inventory: $BYTES bytes -> $KEY"

      - name: Code bundle
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=code-${DAY}.tar.gz

          # Full git history in one archive, independent of GitHub
          git bundle create repo.bundle --all 2>bundle.err
          if [ $? -ne 0 ]; then
            ERR=$(head -3 bundle.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'code', 'failed', 'git bundle failed: $ERR');"
            echo "::error::Code bundle failed: $ERR"
            exit 0
          fi

          tar czf "$OUT" repo.bundle 2>tar.err
          if [ $? -ne 0 ]; then
            ERR=$(head -3 tar.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'code', 'failed', 'tar failed: $ERR');"
            echo "::error::Tar failed: $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="code/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'code', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'code', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Code bundle: $BYTES bytes -> $KEY"


      - name: Storage mirror (if configured)
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}

          if [ -z "${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'storage', 'skipped', 'Supabase dashboard -> Settings -> Storage -> S3 Access Keys, then add SUPABASE_S3_ACCESS_KEY_ID and SUPABASE_S3_SECRET_ACCESS_KEY as repository secrets');"
            echo "Storage mirror skipped (credentials not configured)"
            exit 0
          fi

          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}

          # Mirror uploaded-files bucket to R2 with 90-day deletion recovery
          STARTED=$(date +%s)
          BACKUP_DIR="r2:${R2_BUCKET}/storage/deleted/$(date -u +%Y-%m-%d)"
          rclone sync sb:uploaded-files "r2:${R2_BUCKET}/storage/${TIER}/uploaded-files" \
            --fast-list --checksum --backup-dir="$BACKUP_DIR" --verbose 2>storage.err >storage.out
          SYNC_EXIT=$?
          DUR=$(($(date +%s) - STARTED))

          if [ $SYNC_EXIT -ne 0 ]; then
            ERR=$(head -5 storage.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'storage', 'failed', 'rclone sync exit $SYNC_EXIT: $ERR');"
            echo "::error::Storage sync failed (exit $SYNC_EXIT): $ERR"
            exit 0
          fi

          # Parse rclone stats for object count and bytes
          # rclone verbose output includes: "Transferred: X / Y Bytes, 100%, Z Bytes/s, ETA -"
          BYTES=$(grep 'Transferred:' storage.out | head -1 | awk '{gsub(/,/,""); print $4}' || echo 0)
          # Count files from rclone stats or checks
          COUNT=$(rclone size "r2:${R2_BUCKET}/storage/${TIER}/uploaded-files" --json 2>/dev/null | jq -r '.count // 0')

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, bytes, object_count, object_key) VALUES ($RID, 'storage', 'ok', ${BYTES:-0}, ${COUNT:-0}, 'storage/${TIER}/uploaded-files');"
          echo "Storage mirror: ${COUNT:-0} objects, ${BYTES:-0} bytes in ${DUR}s"
      - name: Close DR run
        if: always()
        run: |
          set -euo pipefail
          RID=${{ steps.start.outputs.run_id }}

          STATS=$(psql -qtAX -c "SELECT COUNT(*) FILTER (WHERE status = 'ok') AS ok_count, COUNT(*) FILTER (WHERE status IN ('failed','skipped')) AS bad_count FROM governance.dr_artifacts WHERE run_id = $RID;")
          OK_COUNT=$(echo "$STATS" | cut -d'|' -f1)
          BAD_COUNT=$(echo "$STATS" | cut -d'|' -f2)

          if [ "$OK_COUNT" -ge 5 ]; then
            STATUS='complete'
          elif [ "$OK_COUNT" -ge 1 ]; then
            STATUS='partial'
          else
            STATUS='failed'
          fi

          psql -qtAX -c "UPDATE governance.dr_runs SET status = '$STATUS', completed_at = NOW() WHERE id = $RID;"
          echo "DR run $RID closed: $STATUS ($OK_COUNT ok, $BAD_COUNT failed/skipped)"

  drill:
    name: Proven-restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: backup
    if: needs.backup.outputs.db_key != ''
    steps:
      - name: Install postgresql-client-17 and rclone
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone
          psql --version

      - name: Configure rclone
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          endpoint = ${{ env.R2_ENDPOINT }}
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          acl = private
          no_check_bucket = true
          EOF
          rclone lsd r2:${{ env.R2_BUCKET }} >/dev/null && echo "R2 reachable"

      - name: Pull and verify database backup
        run: |
          set -euo pipefail
          RID=${{ needs.backup.outputs.run_id }}
          KEY=${{ needs.backup.outputs.db_key }}

          # Download
          STARTED=$(date +%s)
          rclone copyto "r2:${{ env.R2_BUCKET }}/${KEY}" restore.sql.gz --s3-no-check-bucket
          DOWNLOAD_DUR=$(($(date +%s) - STARTED))
          BYTES=$(stat -c%s restore.sql.gz)
          echo "Downloaded ${BYTES} bytes in ${DOWNLOAD_DUR}s"

          # Verify archive integrity
          if ! gunzip -t restore.sql.gz; then
            psql -qtAX -c "INSERT INTO governance.dr_drills (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'gzip integrity check failed');"
            echo "::error::Archive corrupt"
            exit 1
          fi

          # Parse SQL (proves it's loadable)
          STARTED=$(date +%s)
          gunzip -c restore.sql.gz | head -100000 > sample.sql
          PARSE_DUR=$(($(date +%s) - STARTED))

          TABLES=$(grep -c 'CREATE TABLE' sample.sql || echo 0)
          if [ "$TABLES" -lt 5 ]; then
            psql -qtAX -c "INSERT INTO governance.dr_drills (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'only $TABLES CREATE TABLE found in sample');"
            echo "::error::Suspiciously few tables: $TABLES"
            exit 1
          fi

          psql -qtAX -c "INSERT INTO governance.dr_drills (run_id, data_class, status, verified_bytes, duration_seconds) VALUES ($RID, 'database', 'ok', $BYTES, $DOWNLOAD_DUR);"
          echo "Database drill passed: $TABLES+ tables, ${BYTES} bytes, ${DOWNLOAD_DUR}s download"
