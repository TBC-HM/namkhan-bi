# Disaster Recovery - nightly off-site backup + proven-restore drill
#
# Runs on GitHub Actions deliberately: an independent failure domain from both
# Supabase and Vercel. A backup job hosted inside the system it protects dies with it.
#
# Writes results to governance.dr_runs / dr_artifacts / dr_drills via psql.
# Every data class is independent - one failing class marks itself failed and the
# run reports partial. It never aborts the others.

name: dr-nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-nightly
  cancel-in-progress: false

env:
  R2_BUCKET: tbc-dr-prod
  R2_ENDPOINT: https://c83585fd55ad5b7cd6438054734f3568.r2.cloudflarestorage.com
  PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
  PGUSER: ${{ secrets.SUPABASE_DB_USER }}
  PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PGDATABASE: postgres
  PGPORT: '5432'

jobs:
  backup:
    name: Off-site backup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      run_id: ${{ steps.start.outputs.run_id }}
      db_key: ${{ steps.db.outputs.key }}
    steps:
      - name: Checkout (full history for the code bundle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client-17 and rclone
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone jq
          pg_dump --version

      - name: Configure rclone remotes
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          {
            echo "[r2]"
            echo "type = s3"
            echo "provider = Cloudflare"
            echo "endpoint = ${R2_ENDPOINT}"
            echo "access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}"
            echo "secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}"
            echo "acl = private"
            echo "no_check_bucket = true"
          } > ~/.config/rclone/rclone.conf
          if [ -n "${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" ]; then
            {
              echo ""
              echo "[sb]"
              echo "type = s3"
              echo "provider = Other"
              echo "endpoint = https://kpenyneooigsyuuomgct.storage.supabase.co/storage/v1/s3"
              echo "region = eu-central-1"
              echo "access_key_id = ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}"
              echo "secret_access_key = ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"
              echo "force_path_style = true"
            } >> ~/.config/rclone/rclone.conf
          fi
          rclone lsd r2:${R2_BUCKET} >/dev/null && echo "R2 reachable"

      - name: Open DR run
        id: start
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ "$(date -u +%d)" = "01" ]; then
            echo "tier=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "tier=daily" >> "$GITHUB_OUTPUT"
          fi
          RID=$(psql -qtAX -c "INSERT INTO governance.dr_runs (run_uid, trigger, actor) VALUES ('gh-${{ github.run_id }}', '${{ github.event_name }}', '${{ github.actor }}') RETURNING id;")
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "DR run $RID opened for $DAY"

      - name: Database dump
        id: db
        continue-on-error: true
        run: |
          set +e  # Don't exit on error - we need to record failures
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=db-$(date -u +%Y-%m-%dT%H%M).sql.gz

          # backup_log excluded by data: 5 GB of superseded inline payload.
          # documents_history already carries the same content.
          # idle_in_transaction_session_timeout prevents the open transaction
          # from blocking DDL + autovacuum for 40-70 min (fix for 2026-08-09 incident).
          PGOPTIONS='-c idle_in_transaction_session_timeout=5min' \
          pg_dump --format=plain --no-owner --no-privileges --quote-all-identifiers \
                  --exclude-table-data=documentation.backup_log 2>db.err | gzip -9 > "$OUT"
          DUMP_EXIT=$?

          if [ $DUMP_EXIT -ne 0 ]; then
            ERR=$(head -5 db.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'pg_dump exit $DUMP_EXIT: $ERR');"
            echo "::error::Database dump failed (exit $DUMP_EXIT): $ERR"
            exit 0  # continue-on-error handles this
          fi

          BYTES=$(stat -c%s "$OUT")
          if [ "$BYTES" -lt 100000 ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'dump too small: $BYTES bytes');"
            echo "::error::Database dump suspiciously small: $BYTES bytes"
            exit 0
          fi

          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="db/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          REMOTE_SUM=$(rclone sha256sum "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket | cut -d' ' -f1)
          if [ "$SUM" != "$REMOTE_SUM" ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'database', 'failed', 'sha256 mismatch after upload');"
            echo "::error::SHA256 mismatch: local=$SUM remote=$REMOTE_SUM"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'database', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Database backup: $BYTES bytes -> $KEY (sha256 $SUM)"

      - name: DDL snapshot
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=ddl-${DAY}.sql.gz

          psql -qtAX -c "SELECT obj_description(oid, 'pg_database') FROM pg_database WHERE datname = current_database();" | gzip -9 > "$OUT" 2>ddl.err
          DDL_EXIT=$?

          if [ $DDL_EXIT -ne 0 ]; then
            ERR=$(head -5 ddl.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'ddl', 'failed', 'DDL export exit $DDL_EXIT: $ERR');"
            echo "::error::DDL export failed (exit $DDL_EXIT): $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="ddl/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'ddl', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'ddl', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "DDL snapshot: $BYTES bytes -> $KEY"

      - name: Config export
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=config-$(date -u +%Y-%m-%dT%H%M).json.gz

          # Export from governance.system_config (ADR-278)
          psql -qtAX -c "COPY (SELECT jsonb_object_agg(key, value) FROM governance.system_config WHERE key NOT LIKE '%secret%' AND key NOT LIKE '%password%') TO STDOUT;" | gzip -9 > "$OUT" 2>config.err
          CFG_EXIT=$?

          if [ $CFG_EXIT -ne 0 ]; then
            ERR=$(head -5 config.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'config', 'failed', 'config export exit $CFG_EXIT: $ERR');"
            echo "::error::Config export failed (exit $CFG_EXIT): $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="config/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'config', 'failed', 'upload failed');"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'config', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Config export: $BYTES bytes -> $KEY"

      - name: Credentials vault export
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=credentials-$(date -u +%Y-%m-%dT%H%M).json.gz.enc

          # Export credential inventory (names + reissue locations, never secrets)
          psql -qtAX -c "COPY (SELECT jsonb_object_agg(credential_name, jsonb_build_object('system', system, 'reissue_at', reissue_at, 'status', status)) FROM governance.credentials) TO STDOUT;" | gzip -9 | openssl enc -aes-256-cbc -pbkdf2 -pass pass:'${{ secrets.DR_VAULT_PASSWORD }}' > "$OUT" 2>creds.err
          CREDS_EXIT=$?

          if [ $CREDS_EXIT -ne 0 ]; then
            ERR=$(head -5 creds.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'credentials', 'failed', 'export exit $CREDS_EXIT: $ERR');"
            echo "::error::Credentials export failed (exit $CREDS_EXIT): $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="creds/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'credentials', 'failed', 'upload failed');"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'credentials', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Credentials vault: $BYTES bytes -> $KEY"

      - name: Code bundle
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          DAY=${{ steps.start.outputs.day }}
          TIER=${{ steps.start.outputs.tier }}
          OUT=code-${DAY}.tar.gz

          tar czf "$OUT" .git 2>tar.err
          TAR_EXIT=$?

          if [ $TAR_EXIT -ne 0 ]; then
            ERR=$(head -5 tar.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'code', 'failed', 'tar exit $TAR_EXIT: $ERR');"
            echo "::error::Code bundle failed (exit $TAR_EXIT): $ERR"
            exit 0
          fi

          BYTES=$(stat -c%s "$OUT")
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          KEY="code/${TIER}/${OUT}"

          if ! rclone copyto "$OUT" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket 2>upload.err; then
            ERR=$(head -3 upload.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'code', 'failed', 'upload failed: $ERR');"
            echo "::error::R2 upload failed: $ERR"
            exit 0
          fi

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, sha256, storage_key) VALUES ($RID, 'code', 'ok', $BYTES, '$SUM', '$KEY');"
          echo "Code bundle: $BYTES bytes -> $KEY"

      - name: Storage mirror
        continue-on-error: true
        run: |
          set +e
          RID=${{ steps.start.outputs.run_id }}
          TIER=${{ steps.start.outputs.tier }}

          if [ -z "${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" ]; then
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'storage', 'failed', 'Supabase S3 credentials not configured — visit https://supabase.com/dashboard/project/kpenyneooigsyuuomgct/settings/storage and set SUPABASE_S3_ACCESS_KEY_ID + SUPABASE_S3_SECRET_ACCESS_KEY in GitHub secrets');"
            exit 0
          fi

          # Sync all buckets from Supabase S3 to R2 storage/ namespace
          # --backup-dir captures deletions (recovery window for accidental bulk-delete)
          rclone sync sb: "r2:${R2_BUCKET}/storage/${TIER}/" \
            --s3-no-check-bucket \
            --backup-dir "r2:${R2_BUCKET}/storage/${TIER}-deleted/" \
            --transfers 8 \
            --checkers 16 \
            --fast-list 2>storage.err

          if [ $? -ne 0 ]; then
            ERR=$(head -5 storage.err | tr '\n' ' ' | cut -c1-200)
            psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, error_text) VALUES ($RID, 'storage', 'failed', 'rclone sync exit $?: $ERR');"
            echo "::error::Storage mirror failed: $ERR"
            exit 0
          fi

          BYTES=$(rclone size "r2:${R2_BUCKET}/storage/${TIER}/" --s3-no-check-bucket --json | jq -r '.bytes')
          COUNT=$(rclone size "r2:${R2_BUCKET}/storage/${TIER}/" --s3-no-check-bucket --json | jq -r '.count')

          psql -qtAX -c "INSERT INTO governance.dr_artifacts (run_id, data_class, status, size_bytes, storage_key, object_count) VALUES ($RID, 'storage', 'ok', $BYTES, 'storage/${TIER}/', $COUNT);"
          echo "Storage mirror: $COUNT files, $BYTES bytes -> storage/${TIER}/"

      - name: Close run
        if: always()
        run: |
          set -euo pipefail
          RID=${{ steps.start.outputs.run_id }}
          
          OK=$(psql -qtAX -c "SELECT COUNT(*) FROM governance.dr_artifacts WHERE run_id = $RID AND status = 'ok';")
          FAIL=$(psql -qtAX -c "SELECT COUNT(*) FROM governance.dr_artifacts WHERE run_id = $RID AND status = 'failed';")
          
          if [ "$FAIL" -eq 0 ]; then
            STATUS="success"
          elif [ "$OK" -gt 0 ]; then
            STATUS="partial"
          else
            STATUS="failed"
          fi
          
          psql -qtAX -c "UPDATE governance.dr_runs SET status = '$STATUS', finished_at = now(), duration_secs = EXTRACT(EPOCH FROM (now() - started_at))::int WHERE id = $RID;"
          echo "DR run $RID closed: $STATUS ($OK ok, $FAIL failed)"

  drill:
    name: Proven-restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: backup
    if: needs.backup.outputs.db_key != ''
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drillpass
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Install postgresql-client-17 and rclone
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 rclone
          pg_dump --version

      - name: Configure rclone
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          {
            echo "[r2]"
            echo "type = s3"
            echo "provider = Cloudflare"
            echo "endpoint = ${{ env.R2_ENDPOINT }}"
            echo "access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}"
            echo "secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}"
            echo "acl = private"
            echo "no_check_bucket = true"
          } > ~/.config/rclone/rclone.conf

      - name: Restore drill
        timeout-minutes: 90
        env:
          DRILL_PGHOST: postgres
          DRILL_PGUSER: postgres
          DRILL_PGPASSWORD: drillpass
          DRILL_PGDATABASE: postgres
          DRILL_PGPORT: 5432
        run: |
          set -euo pipefail
          RID=${{ needs.backup.outputs.run_id }}
          KEY=${{ needs.backup.outputs.db_key }}
          DRILL_DB=dr_drill_$(date +%s)

          echo "Downloading $KEY from R2..."
          rclone copyto "r2:${R2_BUCKET}/${KEY}" backup.sql.gz --s3-no-check-bucket

          BYTES=$(stat -c%s backup.sql.gz)
          echo "Downloaded $BYTES bytes"

          echo "Creating drill database $DRILL_DB on service container..."
          psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_PGDATABASE" -c "CREATE DATABASE $DRILL_DB;"

          echo "Restoring backup..."
          START=$(date +%s)
          gunzip -c backup.sql.gz | psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_DB" -v ON_ERROR_STOP=0 2>restore.err
          RESTORE_EXIT=$?
          END=$(date +%s)
          DURATION=$((END - START))

          echo "Restore completed in ${DURATION}s (exit $RESTORE_EXIT)"

          # Count schemas
          SCHEMAS=$(psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_DB" -qtAX -c "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name NOT IN ('pg_catalog', 'information_schema', 'pg_toast');")

          # Count tables
          TABLES=$(psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_DB" -qtAX -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog', 'information_schema', 'pg_toast') AND table_type = 'BASE TABLE';")

          # Sample verification queries
          ROOMS=$(psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_DB" -qtAX -c "SELECT COUNT(*) FROM property.rooms;" 2>/dev/null || echo "0")
          BOOKINGS=$(psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_DB" -qtAX -c "SELECT COUNT(*) FROM bookings.bookings;" 2>/dev/null || echo "0")

          # Check for restore errors
          ERROR_LINES=$(wc -l < restore.err)
          if [ "$ERROR_LINES" -gt 0 ]; then
            ERRORS=$(head -20 restore.err | jq -Rs .)
          else
            ERRORS='[]'
          fi

          # Determine pass/fail
          if [ "$RESTORE_EXIT" -eq 0 ] && [ "$SCHEMAS" -ge 20 ] && [ "$TABLES" -ge 100 ]; then
            PASSED=true
          else
            PASSED=false
          fi

          # Build detail JSON
          DETAIL=$(jq -n \
            --arg duration "$DURATION" \
            --arg schemas "$SCHEMAS" \
            --arg tables "$TABLES" \
            --arg rooms "$ROOMS" \
            --arg bookings "$BOOKINGS" \
            --argjson errors "$ERRORS" \
            '{
              restore_duration_secs: ($duration | tonumber),
              schemas_checked: ($schemas | tonumber),
              tables_checked: ($tables | tonumber),
              sample_counts: {
                rooms: ($rooms | tonumber),
                bookings: ($bookings | tonumber)
              },
              table_pct: (if ($tables | tonumber) > 0 then (($tables | tonumber) / 300.0 * 100) else 0 end),
              top_errors: $errors
            }')

          # Write to dr_drills
          psql -qtAX <<EOSQL
          INSERT INTO governance.dr_drills (run_id, drill_db, passed, schemas_checked, detail)
          VALUES (
            $RID,
            '$DRILL_DB',
            $PASSED,
            $SCHEMAS,
            '$DETAIL'::jsonb
          );
EOSQL

          # Clean up
          echo "Dropping drill database..."
          psql -h "$DRILL_PGHOST" -U "$DRILL_PGUSER" -d "$DRILL_PGDATABASE" -c "DROP DATABASE IF EXISTS $DRILL_DB;"

          echo "Drill complete: passed=$PASSED, schemas=$SCHEMAS, tables=$TABLES"
